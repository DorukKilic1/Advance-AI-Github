<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithm Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .top-banner {
      width: calc(100% - 40px);
      margin: 16px 20px 0 20px;
      background: darkred;
      color: white;
      text-align: center;
      padding: 18px 12px;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .page-content {
      min-height: calc(100vh - 90px);
      position: relative;
      padding: 30px 20px 80px 20px;
    }

    .left-link-panel {
      padding-top: 8px;
      padding-left: 6px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: flex-start;
    }

    .link-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .tool-link {
      color: white;
      font-size: 1.6rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .tool-link:hover {
      color: #ff4d4d;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.35);
    }

    .doc-link {
      color: white;
      font-size: 1.05rem;
      text-decoration: none;
      font-weight: 400;
      opacity: 0.9;
      transition: color 0.2s ease, text-shadow 0.2s ease, opacity 0.2s ease;
    }

    .doc-link:hover {
      color: #ff4d4d;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.35);
      opacity: 1;
    }

    .right-images {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: min(360px, 32vw);
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 5;
    }

    .image-card {
      width: 100%;
      text-align: center;
    }

    .image-top-link {
      display: inline-block;
      margin-bottom: 10px;
      color: white;
      font-size: 1rem;
      text-decoration: none;
      font-weight: 400;
      opacity: 0.9;
      transition: color 0.2s ease, text-shadow 0.2s ease, opacity 0.2s ease;
    }

    .image-top-link:hover {
      color: #ff4d4d;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.35);
      opacity: 1;
    }

    .click-image {
      width: 100%;
      display: block;
      border: 4px solid red;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      background: #111;
    }

    .click-image:hover {
      transform: scale(1.03);
      box-shadow: 0 0 22px rgba(255, 0, 0, 0.45);
    }

    .caption {
      margin-top: 10px;
      font-size: 1.1rem;
      color: white;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 999;
    }

    .overlay.active {
      display: flex;
    }

    .overlay-content {
      max-width: 92vw;
      max-height: 92vh;
      text-align: center;
    }

    .overlay img {
      max-width: 100%;
      max-height: 82vh;
      border: 5px solid red;
      border-radius: 16px;
      background: #111;
      box-shadow: 0 0 28px rgba(255, 0, 0, 0.4);
    }

    .overlay .caption {
      margin-top: 14px;
      font-size: 1.2rem;
    }

    .close-text {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #ddd;
    }

    .footer-mark {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: white;
      opacity: 0.9;
      z-index: 20;
      text-align: center;
      white-space: nowrap;
      font-weight: bold;
    }

    @media (max-width: 900px) {
      .right-images {
        width: min(280px, 42vw);
        right: 16px;
        bottom: 16px;
      }

      .top-banner {
        font-size: 1.5rem;
      }

      .tool-link {
        font-size: 1.3rem;
      }

      .doc-link {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 600px) {
      .right-images {
        position: static;
        width: 100%;
        max-width: 320px;
        margin: 40px auto 0 auto;
      }

      .page-content {
        padding-bottom: 40px;
      }

      .footer-mark {
        position: static;
        transform: none;
        margin: 30px auto 10px auto;
      }
    }
  </style>
</head>
<body>
  <div class="top-banner">Algorithm Website</div>

  <main class="page-content">
    <div class="left-link-panel">
      <div class="link-group">
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Data%20Science%20Fitting"
          target="_blank"
          rel="noopener noreferrer"
          class="tool-link"
        >
          ToolsFittingMachine
        </a>
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Data%20Science%20Fitting"
          target="_blank"
          rel="noopener noreferrer"
          class="doc-link"
        >
          Documentation
        </a>
      </div>

      <div class="link-group">
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Grades.ipynb"
          target="_blank"
          rel="noopener noreferrer"
          class="tool-link"
        >
          LearningProbability
        </a>
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Documentation%20Machine%20Learning"
          target="_blank"
          rel="noopener noreferrer"
          class="doc-link"
        >
          Documentation
        </a>
      </div>

      <div class="link-group">
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Density%20Estimation.ipynb"
          target="_blank"
          rel="noopener noreferrer"
          class="tool-link"
        >
          Density Estimation
        </a>
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Documentation%20of%20Density%20Estimation"
          target="_blank"
          rel="noopener noreferrer"
          class="doc-link"
        >
          Documentation
        </a>
      </div>

      <div class="link-group">
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/presentation.ipynb"
          target="_blank"
          rel="noopener noreferrer"
          class="tool-link"
        >
          Transformations
        </a>
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/Documentation%20For%20Project%20png%20(transform)"
          target="_blank"
          rel="noopener noreferrer"
          class="doc-link"
        >
          Documentation
        </a>
      </div>
    </div>

    <div class="right-images">
      <div class="image-card">
        <a
          href="https://github.com/DorukKilic1/Advance-AI-Github/blob/main/README.md"
          target="_blank"
          rel="noopener noreferrer"
          class="image-top-link"
        >
          Documentation
        </a>
        <img
          src="./triangle.png"
          alt="Triangle Solver Website"
          class="click-image"
          id="triangleImage"
        />
        <div class="caption">
  <a
    href="https://dorukkilic1.github.io/Advance-AI-Github/triangle.html"
    style="color: white; text-decoration: none;"
  >
    Triangle Solver Website
  </a>
</div>
      </div>

      <div class="image-card">
        <img
          src="./poster.png"
          alt="Poster"
          class="click-image"
          id="posterImage"
        />
        <div class="caption">Poster</div>
      </div>
    </div>
  </main>

  <div class="overlay" id="imageOverlay">
    <div class="overlay-content">
      <img src="" alt="Enlarged preview" id="overlayImage" />
      <div class="caption" id="overlayCaption"></div>
      <div class="close-text">Click anywhere to close</div>
    </div>
  </div>

  <div class="footer-mark">DoDo 2025™</div>

  <script>
    const imageOverlay = document.getElementById("imageOverlay");
    const overlayImage = document.getElementById("overlayImage");
    const overlayCaption = document.getElementById("overlayCaption");

    const triangleImage = document.getElementById("triangleImage");
    const posterImage = document.getElementById("posterImage");

    function openOverlay(src, caption) {
      overlayImage.src = src;
      overlayCaption.textContent = caption;
      imageOverlay.classList.add("active");
    }

    triangleImage.addEventListener("click", () => {
      openOverlay("./triangle.png", "Triangle Solver Website");
    });

    posterImage.addEventListener("click", () => {
      openOverlay("./poster.png", "Poster");
    });

    imageOverlay.addEventListener("click", () => {
      imageOverlay.classList.remove("active");
    });
  </script>
</body>
</html>
